version: '3.8'
services:
  redis:
    image: redis:alpine
    container_name: nest_redis
    ports:
      - "6379:6379"
    restart: always

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
    container_name: nest_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - nest_esdata:/usr/share/elasticsearch/data
    restart: always

volumes:
  nest_esdata:
    driver: local