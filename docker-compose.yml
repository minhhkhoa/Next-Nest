services:
  backend:
    container_name: do_an_khoa-server
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./server/.env.prod
    environment:
      PORT: "${BACKEND_PORT}"
      FRONTEND_URL: "http://${SERVER_IP}:${FRONTEND_PORT}"
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    depends_on:
      - redis
    networks:
      - jobhub-network

  frontend:
    container_name: do_an_khoa-client
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "/api"
        NEXT_PUBLIC_API_URL_SERVER: "/api"
        NEXT_PUBLIC_API_URL_SERVER_BASE: ""
        NEXT_PUBLIC_API_URL_CLIENT: ""
        NEXT_PUBLIC_SEPAY_BASE_URL: "${NEXT_PUBLIC_SEPAY_BASE_URL}"
        NEXT_PUBLIC_SEPAY_ACCOUNT: "${NEXT_PUBLIC_SEPAY_ACCOUNT}"
        NEXT_PUBLIC_SEPAY_BANK: "${NEXT_PUBLIC_SEPAY_BANK}"
        NEXT_PUBLIC_JWT_SECRET: "${NEXT_PUBLIC_JWT_SECRET}"
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: "/api"
      NEXT_PUBLIC_API_URL_SERVER: "/api"
      NEXT_PUBLIC_API_URL_SERVER_BASE: ""
      NEXT_PUBLIC_API_URL_CLIENT: ""
    ports:
      - "${FRONTEND_PORT}:3000"
    depends_on:
      - backend
    networks:
      - jobhub-network

  redis:
    image: redis:alpine
    container_name: do_an_khoa-redis
    restart: unless-stopped
    networks:
      - jobhub-network

  nginx-proxy:
    image: nginx:alpine
    container_name: do_an_khoa-nginx
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - backend
      - frontend
    networks:
      - jobhub-network

networks:
  jobhub-network:
    driver: bridge
