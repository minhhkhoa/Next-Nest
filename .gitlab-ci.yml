# ================================================
# GitLab CI/CD - Simple Deployment for Company Server
# ================================================

stages:
  - build
  - deploy

variables:
  SERVER_IP: "192.168.91.14"
  BACKEND_PORT: "2302"
  FRONTEND_PORT: "2303"
  # Biến môi trường cho Frontend (Injected at build time)
  NEXT_PUBLIC_API_URL: "http://${SERVER_IP}:${BACKEND_PORT}"
  NEXT_PUBLIC_API_URL_SERVER: "http://${SERVER_IP}:${BACKEND_PORT}/api"
  NEXT_PUBLIC_API_URL_SERVER_BASE: "http://${SERVER_IP}:${BACKEND_PORT}"
  NEXT_PUBLIC_API_URL_CLIENT: "http://${SERVER_IP}:${FRONTEND_PORT}"

# 1. JOB BUILD
# ================================================
build_project:
  stage: build
  tags:
    - doan_jobhub
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - echo "Preparing environment files..."
    - cp $SERVER_ENV_PROD ./server/.env.prod
    - cp $CLIENT_ENV_PROD ./client/.env.production
    - echo "Building Backend..."
    - cd server && npm install && npm run build && cd ..
    - echo "Building Frontend..."
    - cd client && npm install && npm run build && cd ..
  artifacts:
    paths:
      - server/dist/
      - server/.env.prod
      - client/.next/
      - client/public/
      - client/package.json
      - client/next.config.ts
    expire_in: 1 hour

# 2. JOB DEPLOY
# ================================================
deploy_to_server:
  stage: deploy
  tags:
    - doan_jobhub
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  needs:
    - build_project
  script:
    - echo "Preparing .env file for Docker Compose..."
    - cp $CLIENT_ENV_PROD .env
    - cp $SERVER_ENV_PROD server/.env.prod
    - echo "Deploying services using Docker Compose..."
    - docker compose up -d --build
    - docker ps
  when: on_success
