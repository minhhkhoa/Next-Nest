server {
    listen 80;

    # Tăng giới hạn dung lượng file upload lên 50MB
    client_max_body_size 50M;

    # Cấu hình cho Socket.io (Để nhận thông báo thanh toán thành công thời gian thực)
    location /socket.io {
        proxy_pass http://do_an_khoa-server:2302;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Cấu hình cho Frontend (Next.js)
    location / {
        proxy_pass http://do_an_khoa-client:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        
        # Truyền Cookie cho Middleware Next.js
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
    }

    # cấu hình riêng cho api chat stream để tránh bị nginx buffer cho server-sent events (sse)
    location /api/ai/chat/stream {
        proxy_pass http://do_an_khoa-server:2302;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        
        # tắt buffering để hỗ trợ truyền tải stream thời gian thực
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
    }

    # Cấu hình cho Backend (NestJS API)
    location /api {
        proxy_pass http://do_an_khoa-server:2302;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        
        # Truyền Cookie và thông tin đăng nhập
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
    }
}
