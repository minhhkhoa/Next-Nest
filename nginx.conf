server {
    listen 80;

    # Cấu hình cho Frontend
    location / {
        proxy_pass http://do_an_khoa-client:3000; # Kết nối tới container client
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Cấu hình cho Backend (API)
    location /api {
        proxy_pass http://do_an_khoa-server:2302; # Kết nối tới container server
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
